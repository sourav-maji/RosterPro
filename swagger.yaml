openapi: 3.0.4

info:
  title: SmartShift / RosterPro API
  version: "1.0.0"
  description: >
    Multi-tenant workforce scheduling platform with RBAC and ML-based rostering.

servers:
  - url: http://localhost:3000/api/v1
  - url: http://localhost:PORT/api/v1

security:
  - bearerAuth: []

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    ApiResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { type: object }

    # ================= AUTH =================
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    PasswordChange:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string }
        newPassword: { type: string }

    PasswordReset:
      type: object
      required: [userId, newPassword]
      properties:
        userId: { type: string }
        newPassword: { type: string }

    # ================= ORG =================
    Organization:
      type: object
      properties:
        name: { type: string }
        contactEmail: { type: string }
        type:
          type: string
          enum: [HOSPITAL, FACTORY, GENERIC]

    # ================= USERS =================
    User:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        roleId: { type: string }
        departmentId: { type: string }

    # ================= DEPARTMENT =================
    Department:
      type: object
      properties:
        name: { type: string }
        description: { type: string }

    # ================= SHIFTS =================
    Shift:
      type: object
      properties:
        name: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        durationHours: { type: number }

    # ================= SHIFT REQUIREMENT =================
    ShiftRequirement:
      type: object
      properties:
        departmentId: { type: string }
        shiftId: { type: string }
        roleId: { type: string }
        requiredCount: { type: integer }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }

    # ================= RBAC =================
    PermissionCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        module: { type: string }

    RoleCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }

    RolePermissionAssign:
      type: object
      required: [roleId, permissionId]
      properties:
        roleId: { type: string }
        permissionId: { type: string }

    RolePermissionBulk:
      type: object
      required: [roleId, permissionIds]
      properties:
        roleId: { type: string }
        permissionIds:
          type: array
          items: { type: string }

    # ================= SCHEDULER =================
    SchedulerPreviewRequest:
      type: object
      required: [departmentId, date]
      properties:
        departmentId: { type: string }
        date: { type: string, format: date }

    SchedulerSaveRequest:
      type: object
      required: [result, departmentId, meta]
      properties:
        result: { type: object }
        departmentId: { type: string }
        meta: { type: object }

paths:

  # ================= AUTH =================
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses: { "200": { description: OK } }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses: { "200": { description: OK } }

  /auth/change-password:
    post:
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses: { "200": { description: OK } }

  /auth/reset-password:
    post:
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordReset" }
      responses: { "200": { description: OK } }

  /auth/logout:
    post:
      tags: [Auth]
      responses: { "200": { description: OK } }

  /auth/logout-all:
    post:
      tags: [Auth]
      responses: { "200": { description: OK } }

  /auth/permissions:
    get:
      tags: [Auth]
      summary: My permissions
      responses: { "200": { description: OK } }

  # ================= ORG =================
  /org:
    post:
      tags: [Organization]
      summary: Create org
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Organization" }
      responses: { "200": { description: OK } }

    get:
      tags: [Organization]
      summary: List orgs
      responses: { "200": { description: OK } }

  /org/count:
    get:
      tags: [Organization]
      responses: { "200": { description: OK } }

  /org/me:
    get:
      tags: [Organization]
      responses: { "200": { description: OK } }

  /org/{id}:
    get:
      tags: [Organization]
      responses: { "200": { description: OK } }

    put:
      tags: [Organization]
      responses: { "200": { description: OK } }

    delete:
      tags: [Organization]
      responses: { "200": { description: OK } }

  /org/{id}/toggle:
    patch:
      tags: [Organization]
      responses: { "200": { description: OK } }

  # ================= USERS =================
  /users:
    get:
      tags: [Users]
      responses: { "200": { description: OK } }

    post:
      tags: [Users]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/User" }
      responses: { "200": { description: OK } }

  /users/count:
    get:
      tags: [Users]
      responses: { "200": { description: OK } }

  /users/{id}:
    get:
      tags: [Users]
      responses: { "200": { description: OK } }

    put:
      tags: [Users]
      responses: { "200": { description: OK } }

    delete:
      tags: [Users]
      responses: { "200": { description: OK } }

  /users/toggle/{id}:
    post:
      tags: [Users]
      responses: { "200": { description: OK } }

  # ================= DEPARTMENTS =================
  /departments:
    get:
      tags: [Departments]
      responses: { "200": { description: OK } }

    post:
      tags: [Departments]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Department" }
      responses: { "200": { description: OK } }

  /departments/{id}:
    put:
      tags: [Departments]
      responses: { "200": { description: OK } }

    delete:
      tags: [Departments]
      responses: { "200": { description: OK } }

  /departments/{id}/users:
    get:
      tags: [Departments]
      responses: { "200": { description: OK } }

  # ================= SHIFTS =================
  /shifts:
    get:
      tags: [Shifts]
      responses: { "200": { description: OK } }

    post:
      tags: [Shifts]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Shift" }
      responses: { "200": { description: OK } }

  /shifts/{id}:
    put:
      tags: [Shifts]
      responses: { "200": { description: OK } }

    delete:
      tags: [Shifts]
      responses: { "200": { description: OK } }

  # ================= SHIFT REQUIREMENT =================
  /shift-req:
    get:
      tags: [Shift Requirement]
      responses: { "200": { description: OK } }

    post:
      tags: [Shift Requirement]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShiftRequirement" }
      responses: { "200": { description: OK } }

  /shift-req/bulk:
    post:
      tags: [Shift Requirement]
      responses: { "200": { description: OK } }

  /shift-req/{id}:
    put:
      tags: [Shift Requirement]
      responses: { "200": { description: OK } }

    delete:
      tags: [Shift Requirement]
      responses: { "200": { description: OK } }

  /shift-req/department/{deptId}:
    get:
      tags: [Shift Requirement]
      responses: { "200": { description: OK } }

  /shift-req/department/{deptId}/shift/{shiftId}:
    get:
      tags: [Shift Requirement]
      responses: { "200": { description: OK } }

  # ================= RBAC =================
  /permissions:
    post:
      tags: [Permissions]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionCreate" }
      responses: { "200": { description: OK } }

    get:
      tags: [Permissions]
      responses: { "200": { description: OK } }

  /permissions/{id}:
    put:
      tags: [Permissions]
      responses: { "200": { description: OK } }

  /roles:
    post:
      tags: [Roles]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleCreate" }
      responses: { "200": { description: OK } }

    get:
      tags: [Roles]
      responses: { "200": { description: OK } }

  /roles/{id}:
    put:
      tags: [Roles]
      responses: { "200": { description: OK } }

    delete:
      tags: [Roles]
      responses: { "200": { description: OK } }

  /role-permission:
    post:
      tags: [RolePermission]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolePermissionAssign" }
      responses: { "200": { description: OK } }

  /role-permission/bulk:
    post:
      tags: [RolePermission]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolePermissionBulk" }
      responses: { "200": { description: OK } }

  /role-permission/{id}:
    delete:
      tags: [RolePermission]
      responses: { "200": { description: OK } }

  /role-permission/role/{roleId}:
    get:
      tags: [RolePermission]
      responses: { "200": { description: OK } }

  # ================= SCHEDULER =================
  /scheduler/preview:
    post:
      tags: [Scheduler]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchedulerPreviewRequest" }
      responses: { "200": { description: OK } }

  /scheduler/save:
    post:
      tags: [Scheduler]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchedulerSaveRequest" }
      responses: { "200": { description: OK } }

  # ================= ALLOCATION =================
  /alloc:
    get:
      tags: [Allocation]
      responses: { "200": { description: OK } }

  /alloc/manual:
    post:
      tags: [Allocation]
      responses: { "200": { description: OK } }

  /alloc/ml:
    post:
      tags: [Allocation]
      responses: { "200": { description: OK } }

  /alloc/swap:
    post:
      tags: [Allocation]
      responses: { "200": { description: OK } }

  /alloc/{id}:
    delete:
      tags: [Allocation]
      responses: { "200": { description: OK } }

  /alloc/board:
    get:
      tags: [Allocation]
      responses: { "200": { description: OK } }

  /alloc/calendar:
    get:
      tags: [Allocation]
      responses: { "200": { description: OK } }

  /alloc/coverage:
    get:
      tags: [Allocation]
      responses: { "200": { description: OK } }
